 продуктами, которые вы сможете использовать, как в университете, так и вне него 😉",(t=document.createElement("textarea")).innerHTML=n,t.value))}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","mainEntityOfPage":{"@type":"WebPage","@id":"https://rtuitlab.dev"},"headline":"Победа в «Акселераторе 3.0 РТУ МИРЭА»","image":"/images/achievements/rtumirea-accelerator-2022/resized_zKHdoYh8vKw.webp","author":{"@type":"Organization","name":"RTUITLab","url":"https://rtuitlab.dev"},"publisher":{"@type":"Organization","name":"RTUITLab","logo":{"@type":"ImageObject","url":""}},"datePublished":""}</script><body class="achievementsPageTemplate"><header><section class="buttonContainer"><button onclick="if(window.history.length&gt;2)window.history.back();else{window.location=&quot;/&quot;}"><img src="/static/buttonArrow.b3b90ce2.svg" alt="">Назад</button><div class="titleContainer"><h1>Победа в «Акселераторе 3.0 РТУ МИРЭА»</h1></div></section><section class="desc"></section></header><main><section class="content"><div class="galleryParent"><div class="swiper achievementsSwiperParent"><div class="swiper-wrapper"><div class="swiper-slide"><img src="/static/resized_zKHdoYh8vKw.916dc6bc.webp" alt="" loading="lazy"></div></div></div><div class="swiper-pagination achievementsSwiperPagination"></div></div><article class="info"><h3>О событии</h3><section id="longdescription"></section><p><strong>Дата новости: 28.03.2022</strong></article></section><section class="members"><h2>Участники</h2><section class="itemsParent"><div class="item"><p>Никита Миронов</div><div class="item"><p>Даниил Демин</div><div class="item"><p>Иван Малов</div><div class="item"><p>Александр Ченцов</div><div class="item"><p>Кирилл Подольский</div><div class="item"><p>Никита Морошкин</div><div class="item"><p>Александр Корольков</div></section></section></main>
