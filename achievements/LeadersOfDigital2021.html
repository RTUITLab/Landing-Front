<!doctype html><html lang="ru"><meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTUITLab — Взяли Цифровой Прорыв «Умные города, промышленность, ТЭК»</title><script async>let scripts=["../dist/markdown-it.js","../dist/swiper-bundle.min.js"];for(let e of scripts){var js=document.createElement("script");js.src=e,js.async="async";var head=document.getElementsByTagName("head")[0];head.appendChild(js)}</script><meta name="description" content=""><link rel="stylesheet" href="/dist/swiper-bundle.min.469728d3.css"><link rel="canonical" href="https://rtuitlab.dev"><link rel="stylesheet" href="/dist/achievementPageTemplate.17ff8d3b.css"><script src="/dist/achievementPageTemplate.3a22a1c3.js" defer></script><link rel="stylesheet" href="/dist/indexStyles.afc5dc3e.css"><script defer>window.onload=function(){var n,e,t=window.markdownit({html:!0,xhtmlOut:!0,breaks:!0,linkify:!0,typographer:!0,quotes:"«»"});document.getElementById("longdescription").innerHTML=t.render((n="\n\nС 21 по 23 мая 2021 года мы успели отличиться на очередном Цифровом Прорыве. Один из первых хакатонов Цифрового Прорыва\n2021 посвящен тематике «Умные города, промышленность, ТЭК», в нем от лаборатории участвовали две команды – RealityGang и\nRealityGaze.\n\nКоманда RealityGaze участвовала в треке «EnergoMach» от Шереметьево и вошла в ТОП-5 команд трека. Это значит, что ребята\nполучили свой билет в Финал!\n\nСостав команды RealityGaze:\nДаниил Демин\nКирилл Шутов\nДмитрий Макаров\n\nА вот команда RealityGang пошла еще дальше и продолжила свою череду побед. Ребята заняли второе место в треке &quot;\nРазработка цифрового помощника для проактивного взаимодействия с пользователями «Навигатора мер поддержки»\nгосударственной информационной системы промышленности (ГИСП)&quot;. Команда не только прошла в Финал, но и получила денежный\nприз размером 150 000 рублей!\n\nСостав команды RealityGang:\nАлександр Ченцов\nКирилл Подольский\nАртем Сергеев\nАлексей Зебзеев\nДмитрий Снегирев\n\nПоздравляем ребят с победой! Теперь участники команд могут с чистой совестью отоспаться перед рабоче-учебной неделей, а\nпосле будут и дальше радовать нас своими успехами! Хобби у RTUITLab такое – хакатоны выигрывать 😉",(e=document.createElement("textarea")).innerHTML=n,e.value))}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","mainEntityOfPage":{"@type":"WebPage","@id":"https://rtuitlab.dev"},"headline":"Взяли Цифровой Прорыв «Умные города, промышленность, ТЭК»","image":"/images/achievements/LeadersOfDigital2021/resized_img.webp","author":{"@type":"Organization","name":"RTUITLab","url":"https://rtuitlab.dev"},"publisher":{"@type":"Organization","name":"RTUITLab","logo":{"@type":"ImageObject","url":""}},"datePublished":""}</script><body class="achievementsPageTemplate"><header><section class="buttonContainer"><button onclick="if(window.history.length&gt;2)window.history.back();else{window.location=&quot;/&quot;}"><img src="/static/buttonArrow.b3b90ce2.svg" alt="">Назад</button><div class="titleContainer"><h1>Взяли Цифровой Прорыв «Умные города, промышленность, ТЭК»</h1></div></section><section class="desc"></section></header><main><section class="content"><div class="galleryParent"><div class="swiper achievementsSwiperParent"><div class="swiper-wrapper"><div class="swiper-slide"><img src="/static/resized_img.b9da2727.webp" alt="" loading="lazy"></div></div></div><div class="swiper-pagination achievementsSwiperPagination"></div></div><article class="info"><h3>О событии</h3><section id="longdescription"></section><p><strong>Дата новости: 23.05.2021</strong></article></section><section class="members"><h2>Участники</h2><section class="itemsParent"><div class="item"><p>Демин Д. Д.</div><div class="item"><p>Шутов К. И.</div><div class="item"><p>Макаров Д. В.</div><div class="item"><p>Ченцов А. Б.</div><div class="item"><p>Подольский К. В.</div><div class="
