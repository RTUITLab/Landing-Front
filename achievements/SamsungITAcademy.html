жение, плата отправляет электронное письмо на почту.\n\n⭐ Цуканов Дмитрий разработал проект по сопоставлению резюме и вакансий. Он позволяет упростить поиск кандидатов или работы подбирая вакансии только по навыкам и опыту кандидата.\n\nПоздравляем ребят с отличным результатом и желаем им успешно развить полученные навыки и применять их в своей практике! 🎉\n\nНапоминаем, что анонсы о наборах на курсы появляются в нашей группе при начале набора.",(e=document.createElement("textarea")).innerHTML=n,e.value))}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","mainEntityOfPage":{"@type":"WebPage","@id":"https://rtuitlab.dev"},"headline":"Финалисты конкурса IT Академии Samsung среди нас","image":"/images/achievements/SamsungITAcademy/resized_img.webp","author":{"@type":"Organization","name":"RTUITLab","url":"https://rtuitlab.dev"},"publisher":{"@type":"Organization","name":"RTUITLab","logo":{"@type":"ImageObject","url":""}},"datePublished":""}</script><body class="achievementsPageTemplate"><header><section class="buttonContainer"><button onclick="if(window.history.length&gt;2)window.history.back();else{window.location=&quot;/&quot;}"><img src="/static/buttonArrow.b3b90ce2.svg" alt="">Назад</button><div class="titleContainer"><h1>Финалисты конкурса IT Академии Samsung среди нас</h1></div></section><section class="desc">В 2021 году двое сотрудников RTUITLab и студентов по совместительству стали финалистами.</section></header><main><section class="content"><div class="galleryParent"><div class="swiper achievementsSwiperParent"><div class="swiper-wrapper"><div class="swiper-slide"><img src="/static/resized_img.4eb77cd4.webp" alt="" loading="lazy"></div></div></div><div class="swiper-pagination achievementsSwiperPagination"></div></div><article class="info"><h3>О событии</h3><section id="longdescription"></section><p><strong>Дата новости: 17.12.2021</strong></article></section><section class="members"><h2>Участники</h2><section
